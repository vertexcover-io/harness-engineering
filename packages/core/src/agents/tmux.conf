# Harness tmux config. tmuxTerminal copies this file to ~/.harness/tmux.conf before its first
# session, and every harness tmux call passes it with -f.

# No prefix and no status bar: the pane looks like a plain terminal and every key reaches the
# agent. Ctrl-\ is the one key tmux keeps, to detach.
set -g prefix None
set -g prefix2 None
unbind C-b
set -g status off
bind -n 'C-\' detach-client

# Mouse, clipboard, RGB and hyperlink passthrough are what Claude Code's TUI relies on.
set -g mouse on
set -s set-clipboard on
set -s escape-time 10
set -s extended-keys on
set -s focus-events on
set -g default-terminal tmux-256color
set -as terminal-features ',*:RGB'
set -as terminal-features ',*:extkeys'
set -as terminal-features ',*:hyperlinks'
set -g allow-passthrough on

# Scrollback and sizing.
set -g history-limit 100000
set -g window-size latest
setw -g aggressive-resize on

# Mouse selection copies without leaving copy mode open.
bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel

# Terminal.app has no OSC 52, so on macOS selections also go through pbcopy.
if-shell "command -v pbcopy" "set -s copy-command pbcopy"
