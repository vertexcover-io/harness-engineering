version: 2

# Typecheck, lint and test over the whole repo, printed as one JSON summary.
baseline: bun run check

workspace:
  layout: mono
  path: .worktrees/{{ branch }}
  baseBranch: v2
  setup: bun install

notifier:
  type: slack

packages:
  sdk:
    path: packages/sdk
    runner: bun
    description: "@yok/sdk: shared primitives (agent, git, process, logger, check)"
    commands:
      bootstrap: bun install
      typecheck: bun run --filter @yok/sdk typecheck
      lint: bunx biome check packages/sdk
      testAll: bun test ./packages/sdk
      testFile: bun test {FILE}

  core:
    path: packages/core
    runner: bun
    description: "@yok/core: config, run events, state, workspace and the orchestrate script"
    commands:
      bootstrap: bun install
      typecheck: bun run --filter @yok/core typecheck
      lint: bunx biome check packages/core
      testAll: bun test ./packages/core
      testFile: bun test {FILE}


  server:
    path: packages/server
    runner: bun
    description: "@yok/server: Hono server and its client"
    commands:
      bootstrap: bun install
      typecheck: bun run --filter @yok/server typecheck
      lint: bunx biome check packages/server
      testAll: bun test ./packages/server
      testFile: bun test {FILE}

  cli:
    path: packages/cli
    runner: bun
    description: "@yok/cli: the yok binary"
    commands:
      bootstrap: bun install
      typecheck: bun run --filter @yok/cli typecheck
      lint: bunx biome check packages/cli
      testAll: bun test ./packages/cli
      testFile: bun test {FILE}
      build: bun run --filter @yok/cli build

  plugins:
    path: packages/plugins
    runner: bun
    description: "@yok/plugins: built-in plugins"
    commands:
      bootstrap: bun install
      typecheck: bun run --filter @yok/plugins typecheck
      lint: bunx biome check packages/plugins
      testAll: null
      testFile: null
