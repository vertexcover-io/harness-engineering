/* ============================================================

:root {
  --bg: #faf9f7; --surface: #ffffff; --surface2: #f3f1ed; --ink: #1a1815; --ink2: #5c5850;
  --line: #e5e1da; --accent: #0d5c4d; --accent-soft: #e3efec; --amber: #92600a; --amber-bg: #fdf3e0;
  --red: #a33529; --red-bg: #fbeae7; --green: #1e6b3a; --green-bg: #e5f2e9; --blue: #1f4e79; --blue-bg: #e8eff6;
  --code-bg: #22201c; --code-ink: #e8e4dc; --code-cm: #8a857a; --chip-bg: #edeae4;
  --tip-bg: #2a2822; --tip-ink: #f2efe9;
}
[data-theme="dark"] {
  --bg: #161412; --surface: #1e1c19; --surface2: #262421; --ink: #ece8e1; --ink2: #a49e93;
  --line: #33302b; --accent: #6fbfa9; --accent-soft: #1d332d; --amber: #e0a83f; --amber-bg: #2e2415;
  --red: #e08273; --red-bg: #33201c; --green: #7cc394; --green-bg: #1a2b1f; --blue: #85aed3; --blue-bg: #1b2733;
  --code-bg: #111009; --code-ink: #ddd8cf; --chip-bg: #2b2925; --tip-bg: #efece5; --tip-ink: #201e1a;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 24px; }
body { background: var(--bg); color: var(--ink); font: 15.5px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
code { font: 0.86em/1.5 ui-monospace, "SF Mono", Menlo, monospace; background: var(--chip-bg); padding: 1px 5px; border-radius: 4px; }
pre { background: var(--code-bg); color: var(--code-ink); border-radius: 10px; padding: 15px 17px; overflow-x: auto; font-size: 12.5px; line-height: 1.55; margin: 10px 0; }
pre code { background: none; padding: 0; color: inherit; font-size: inherit; }
pre .cm { color: var(--code-cm); }
h1 { font-size: 28px; line-height: 1.25; letter-spacing: -0.02em; }
h2 { font-size: 21px; letter-spacing: -0.01em; margin-bottom: 4px; }
h3 { font-size: 16px; margin-bottom: 6px; }
.layout { display: grid; grid-template-columns: 216px minmax(0, 1fr); max-width: 1240px; margin: 0 auto; gap: 34px; padding: 0 26px; }
.side { position: sticky; top: 0; align-self: start; height: 100vh; padding: 26px 0; display: flex; flex-direction: column; border-right: 1px solid var(--line); }
.side .brand { font-size: 12px; font-weight: 700; letter-spacing: 0.07em; color: var(--accent); text-transform: uppercase; padding: 0 14px 14px; }
.side nav { display: flex; flex-direction: column; gap: 1px; overflow-y: auto; }
.side nav a { font-size: 13.5px; color: var(--ink2); padding: 7px 14px; border-radius: 0 8px 8px 0; border-left: 2px solid transparent; }
.side nav a:hover { background: var(--surface2); color: var(--ink); text-decoration: none; }
.side nav a.on { color: var(--accent); border-left-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.side nav .grp { font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink2); padding: 14px 14px 4px; }
.side .foot { margin-top: auto; padding: 14px; }
.theme-btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 5px 12px; font-size: 13px; cursor: pointer; width: 100%; }
main { padding: 30px 0 60px; min-width: 0; }
@media (max-width: 860px) {
  .layout { grid-template-columns: 1fr; gap: 0; }
  .side { position: static; height: auto; border-right: none; border-bottom: 1px solid var(--line); padding: 14px 0; }
  .side nav { flex-direction: row; flex-wrap: wrap; }
  .side nav .grp { display: none; }
  .side .foot { display: none; }

.lede { font-size: 16px; color: var(--ink2); max-width: 720px; margin-top: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 6px; }
.chip { background: var(--chip-bg); border-radius: 999px; padding: 4px 13px; font-size: 12.5px; font-weight: 550; }
.chip b { color: var(--accent); }
.links { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 8px; font-size: 13.5px; }
.callout { border-radius: 12px; padding: 15px 19px; margin: 24px 0; border: 1px solid; }
.callout.warn { background: var(--amber-bg); border-color: color-mix(in srgb, var(--amber) 35%, transparent); }
.callout.warn .ct { color: var(--amber); }
.callout .ct { font-weight: 700; font-size: 12.5px; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 6px; }
.callout p { font-size: 14px; }
section { padding: 30px 0 8px; }
.sec-head { display: flex; align-items: baseline; gap: 13px; border-bottom: 2px solid var(--ink); padding-bottom: 9px; margin-bottom: 20px; }
.sec-head .num { font-size: 12.5px; font-weight: 700; color: var(--accent); }
.sec-head .sub { font-size: 13px; color: var(--ink2); margin-left: auto; text-align: right; }
.grid { display: grid; gap: 13px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 15px 17px; }
.card .tag { font-size: 11px; font-weight: 700; letter-spacing: 0.07em; color: var(--accent); text-transform: uppercase; }
.card h3 { margin-top: 3px; }
.card p { font-size: 13.5px; color: var(--ink2); }
.steps { counter-reset: st; margin: 12px 0; }
.step { display: flex; gap: 15px; padding: 11px 0; border-bottom: 1px dashed var(--line); }
.step:last-child { border-bottom: none; }
.step::before { counter-increment: st; content: counter(st); flex: 0 0 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--surface); font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center; }
.step div { font-size: 14px; }
.step b { display: block; }
table { width: 100%; border-collapse: collapse; font-size: 13px; margin: 8px 0; }
th { text-align: left; font-size: 11.5px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink2); padding: 8px 10px; border-bottom: 2px solid var(--line); }
td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }

.pill.info { background: var(--blue-bg); color: var(--blue); }
details { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); margin: 10px 0; }

<script>
/* ============================================================
   ENGINE — do not edit. Fill the three data objects below.
   ============================================================ */
function toggleTheme() {
  const root = document.documentElement;
  const cur = root.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : cur === 'light' ? 'dark'
    : (matchMedia('(prefers-color-scheme: dark)').matches ? 'light' : 'dark');
  root.setAttribute('data-theme', next);
}
if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.setAttribute('data-theme','dark');

/* SLOT:xrefs — every internal id used anywhere on the page → [tooltip text, jump-target id or ""].
   Cover: requirement ids, decision ids, flow/edge-case ids, error codes. Scenario ids stay
   out — they name a heading in the phase file, not a target on this page. */
const X = {
};

/* SLOT:images — every design/mockup the steps embed, as "file.png": "data:image/png;base64,…".
   Each file appears ONCE here however many steps use it; the engine wires it to every
   <img data-img="file.png">. Omit the entry and that img stays blank — no other breakage. */
const IMG = {
};

/* ---- engine: design images ---- */
document.querySelectorAll('img[data-img]').forEach((el) => {
  const src = IMG[el.dataset.img];
  if (src) { el.src = src; el.loading = 'lazy'; }
});

/* ---- engine: give every <details> a <summary> ----
   A summary-less <details> falls back to the browser's own marker: an unstyled control
   labelled "Details" that collapses the panel behind a word naming nothing. Rather than
   trust every panel to carry one, derive the missing ones — a phase panel from the steps
   it holds, a design panel from the caption or the alt text. */
document.querySelectorAll('details').forEach((d) => {
  if (d.firstElementChild && d.firstElementChild.tagName === 'SUMMARY') return;
  const steps = d.querySelectorAll('.impl > li').length;
  const img = d.querySelector('img');
  const cap = d.querySelector('.cap');
  const label = steps ? 'The work' : (cap && cap.textContent.trim())
    || (img && ('Design — ' + (img.alt || img.dataset.img))) || 'Details';
  const s = document.createElement('summary');
  s.textContent = label;
  if (steps) {
    const c = document.createElement('span');
    c.className = 'cnt'; c.textContent = steps + (steps === 1 ? ' step' : ' steps');
    s.appendChild(c);
  }
  d.prepend(s);
});

/* ---- engine: auto-link internal ids in prose ----
   SLOT:xref-regex — extend the alternation to match this feature's id families.
   Longest alternatives first. */
const RX = /\b(D\d{1,2}|AC\d{1,2}|FL\d{1,2}|EC\d{1,2})\b/g;
function linkify(root) {
  const test = new RegExp(RX.source);
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode(n) {
    const p = n.parentElement;
    if (!p || p.closest('pre, script, style, .x, .cid, nav')) return NodeFilter.FILTER_REJECT;
    return test.test(n.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
  }});
  const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach((n) => {
    const s = n.nodeValue, frag = document.createDocumentFragment();
    let last = 0, m; RX.lastIndex = 0;
    while ((m = RX.exec(s))) {
      const key = m[0];
      if (!X[key]) continue;
      frag.appendChild(document.createTextNode(s.slice(last, m.index)));
      const sp = document.createElement('span');
      sp.className = 'x'; sp.textContent = key; sp.dataset.x = key;
      frag.appendChild(sp); last = m.index + key.length;
    }
    frag.appendChild(document.createTextNode(s.slice(last)));
    n.parentNode.replaceChild(frag, n);
  });
}
linkify(document.getElementById('main'));

/* ---- engine: tooltips + click-to-jump on every .x ---- */
document.querySelectorAll('.x').forEach((sp) => {
  const e = X[sp.dataset.x];
  if (!e) return;
  sp.dataset.t = e[0];
  sp.addEventListener('click', () => {
    if (!e[1]) return;
    const t = document.getElementById(e[1]);
    if (!t) return;
    const d = t.closest('details'); if (d) d.open = true;
    t.scrollIntoView({ behavior: 'smooth', block: 'center' });
    t.classList.remove('flash'); void t.offsetWidth; t.classList.add('flash');
  });
});

/* ---- engine: loaders while the page is still being written ----
   Any SLOT: comment left in the body renders as a spinner; a floating pill
   says the page updates itself. Both vanish once every slot is filled. */
const slotWalker = document.createTreeWalker(document.body, NodeFilter.SHOW_COMMENT);
const pendingSlots = [];
while (slotWalker.nextNode()) {
  if (/^\s*SLOT:/.test(slotWalker.currentNode.nodeValue)) pendingSlots.push(slotWalker.currentNode);
}
pendingSlots.forEach((c) => {
  const el = document.createElement('div');
  el.className = 'slot-loading';
  el.innerHTML = '<span class="spin"></span><span>Still writing this part…</span>';
  c.parentNode.insertBefore(el, c.nextSibling);
});
if (pendingSlots.length) {
  const pill = document.createElement('div');
  pill.className = 'writing-pill';
  pill.innerHTML = '<span class="spin"></span>Plan in progress — updates automatically';
  document.body.appendChild(pill);
}

/* ---- engine: sidebar scroll-spy ---- */
const navLinks = [...document.querySelectorAll('#side-nav a')].filter(a => a.hash);
const spyTargets = navLinks.map(a => document.querySelector(a.hash)).filter(Boolean);
const spy = new IntersectionObserver((entries) => {
  entries.forEach(e => {
    if (!e.isIntersecting) return;
    navLinks.forEach(a => a.classList.toggle('on', a.hash === '#' + e.target.id));
  });
}, { rootMargin: '-20% 0px -70% 0px' });
spyTargets.forEach(t => spy.observe(t));
</script>
