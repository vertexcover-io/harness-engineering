<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plan — being written…</title><!-- SLOT:title — replace the title element's text with
  "<Feature name> · Implementation Plan", then delete this comment. (The slot comment lives
  OUTSIDE <title> because <title> renders markup as literal text.) -->
<style>
/* ============================================================
   MACHINERY — do not edit below unless a slot says so.
   Component classes available to content:
   .card .tag / .grid .g2 .g3 / .pill (ok|err|warn|info) / .chip
   .tiles .tile / .callout (warn|key) / .filter
   .gallery .frame / .screen .screen-frame .els .el / .builds
   .steps .step / table + .tbl-scroll / details + .d-body + .cnt
   .pipe* (numbered pipeline) / .phase* (phase cards) / .unlock
   pre.diff (unified diff, lines coloured by their first character)
   #matrix (the scenario table) / .x (xref)
   ============================================================ */
:root {
  --bg: #faf9f7; --surface: #ffffff; --surface2: #f3f1ed; --ink: #1a1815; --ink2: #5c5850;
  --line: #e5e1da; --accent: #0d5c4d; --accent-soft: #e3efec; --amber: #92600a; --amber-bg: #fdf3e0;
  --red: #a33529; --red-bg: #fbeae7; --green: #1e6b3a; --green-bg: #e5f2e9; --blue: #1f4e79; --blue-bg: #e8eff6;
  --code-bg: #22201c; --code-ink: #e8e4dc; --code-cm: #8a857a; --chip-bg: #edeae4;
  --tip-bg: #2a2822; --tip-ink: #f2efe9;
}
[data-theme="dark"] {
  --bg: #161412; --surface: #1e1c19; --surface2: #262421; --ink: #ece8e1; --ink2: #a49e93;
  --line: #33302b; --accent: #6fbfa9; --accent-soft: #1d332d; --amber: #e0a83f; --amber-bg: #2e2415;
  --red: #e08273; --red-bg: #33201c; --green: #7cc394; --green-bg: #1a2b1f; --blue: #85aed3; --blue-bg: #1b2733;
  --code-bg: #111009; --code-ink: #ddd8cf; --chip-bg: #2b2925; --tip-bg: #efece5; --tip-ink: #201e1a;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 24px; }
body { background: var(--bg); color: var(--ink); font: 15.5px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
code { font: 0.86em/1.5 ui-monospace, "SF Mono", Menlo, monospace; background: var(--chip-bg); padding: 1px 5px; border-radius: 4px; }
pre { background: var(--code-bg); color: var(--code-ink); border-radius: 10px; padding: 15px 17px; overflow-x: auto; font-size: 12.5px; line-height: 1.55; margin: 10px 0; }
pre code { background: none; padding: 0; color: inherit; font-size: inherit; }
pre .cm { color: var(--code-cm); }
h1 { font-size: 28px; line-height: 1.25; letter-spacing: -0.02em; }
h2 { font-size: 21px; letter-spacing: -0.01em; margin-bottom: 4px; }
h3 { font-size: 16px; margin-bottom: 6px; }
.layout { display: grid; grid-template-columns: 216px minmax(0, 1fr); max-width: 1240px; margin: 0 auto; gap: 34px; padding: 0 26px; }
.side { position: sticky; top: 0; align-self: start; height: 100vh; padding: 26px 0; display: flex; flex-direction: column; border-right: 1px solid var(--line); }
.side .brand { font-size: 12px; font-weight: 700; letter-spacing: 0.07em; color: var(--accent); text-transform: uppercase; padding: 0 14px 14px; }
.side nav { display: flex; flex-direction: column; gap: 1px; overflow-y: auto; }
.side nav a { font-size: 13.5px; color: var(--ink2); padding: 7px 14px; border-radius: 0 8px 8px 0; border-left: 2px solid transparent; }
.side nav a:hover { background: var(--surface2); color: var(--ink); text-decoration: none; }
.side nav a.on { color: var(--accent); border-left-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.side nav .grp { font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink2); padding: 14px 14px 4px; }
.side .foot { margin-top: auto; padding: 14px; }
.theme-btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 5px 12px; font-size: 13px; cursor: pointer; width: 100%; }
main { padding: 30px 0 60px; min-width: 0; }
@media (max-width: 860px) {
  .layout { grid-template-columns: 1fr; gap: 0; }
  .side { position: static; height: auto; border-right: none; border-bottom: 1px solid var(--line); padding: 14px 0; }
  .side nav { flex-direction: row; flex-wrap: wrap; }
  .side nav .grp { display: none; }
  .side .foot { display: none; }
}
.kicker { font-size: 12px; font-weight: 650; letter-spacing: 0.09em; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
.lede { font-size: 16px; color: var(--ink2); max-width: 720px; margin-top: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 6px; }
.chip { background: var(--chip-bg); border-radius: 999px; padding: 4px 13px; font-size: 12.5px; font-weight: 550; }
.chip b { color: var(--accent); }
.links { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 8px; font-size: 13.5px; }
.callout { border-radius: 12px; padding: 15px 19px; margin: 24px 0; border: 1px solid; }
.callout.warn { background: var(--amber-bg); border-color: color-mix(in srgb, var(--amber) 35%, transparent); }
.callout.warn .ct { color: var(--amber); }
.callout.key { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
.callout.key .ct { color: var(--accent); }
.callout .ct { font-weight: 700; font-size: 12.5px; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 6px; }
.callout p { font-size: 14px; }
.callout ul { font-size: 13.5px; margin: 6px 0 0 18px; }
section { padding: 30px 0 8px; }
.sec-head { display: flex; align-items: baseline; gap: 13px; border-bottom: 2px solid var(--ink); padding-bottom: 9px; margin-bottom: 20px; }
.sec-head .num { font-size: 12.5px; font-weight: 700; color: var(--accent); }
.sec-head .sub { font-size: 13px; color: var(--ink2); margin-left: auto; text-align: right; }
.grid { display: grid; gap: 13px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 15px 17px; }
.card .tag { font-size: 11px; font-weight: 700; letter-spacing: 0.07em; color: var(--accent); text-transform: uppercase; }
.card h3 { margin-top: 3px; }
.card p { font-size: 13.5px; color: var(--ink2); }
/* .tiles — big-number counts. One .tile per verdict or per total; .n carries the number and a
   pill colour class, .l the label, p one line on what the number means. */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 13px; margin: 14px 0 6px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 15px 17px; }
.tile .n { font-size: 30px; font-weight: 800; line-height: 1; letter-spacing: -0.02em; }
.tile .n.ok { color: var(--green); }
.tile .n.warn { color: var(--amber); }
.tile .n.err { color: var(--red); }
.tile .n.info { color: var(--blue); }
.tile .l { font-size: 11px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink2); margin-top: 8px; }
.tile p { font-size: 13px; color: var(--ink2); margin-top: 4px; }
/* .filter — verdict toggles. Each button's data-v names a verdict; every element with a matching
   data-verdict inside the same <section> hides when at least one button is on and it is not. */
.filter { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin: 18px 0 4px; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink2); }
.filter button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 11px; font: 600 11.5px/1.6 -apple-system, BlinkMacSystemFont, sans-serif; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink2); cursor: pointer; }
.filter button.on.ok { background: var(--green-bg); color: var(--green); border-color: transparent; }
.filter button.on.warn { background: var(--amber-bg); color: var(--amber); border-color: transparent; }
.filter button.on.err { background: var(--red-bg); color: var(--red); border-color: transparent; }
.filter button.on.info { background: var(--blue-bg); color: var(--blue); border-color: transparent; }
[data-verdict].off { display: none; }
/* .gallery — every design frame, open, each with its screen name and what it settles. */
.gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.frame { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
.frame img { width: 100%; height: auto; display: block; border-radius: 8px; border: 1px solid var(--line); }
.frame .ft { font-weight: 650; font-size: 13.5px; margin-top: 9px; }
.frame .fs { font-size: 12.5px; color: var(--ink2); }
.frame .fn { font: 11px ui-monospace, "SF Mono", Menlo, monospace; color: var(--ink2); margin-top: 4px; }
/* .screen — one design frame beside the elements found on it. The frame stays in view while the
   element list scrolls. Stacks on a narrow window. */
.screen { display: grid; grid-template-columns: minmax(260px, 2fr) 3fr; gap: 22px; margin: 18px 0 34px; align-items: start; }
@media (max-width: 860px) { .screen { grid-template-columns: 1fr; } }
.screen-frame { position: sticky; top: 20px; background: var(--surface2); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
.screen-frame img { width: 100%; height: auto; display: block; border-radius: 8px; border: 1px solid var(--line); }
.screen-frame .fn { font: 11.5px ui-monospace, "SF Mono", Menlo, monospace; color: var(--ink2); margin-top: 8px; }
.screen-head { margin: 22px 0 4px; }
.screen-head h3 { font-size: 17px; margin-bottom: 2px; }
.screen-head p { font-size: 13.5px; color: var(--ink2); }
.els { display: flex; flex-direction: column; }
/* .el — one element: id chip · name · verdict pill on the first row; how it is produced (.eu) and
   the file lines (.em) beneath. */
.el { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 5px 12px; padding: 13px 0; border-bottom: 1px solid var(--line); }
.el:last-child { border-bottom: none; }
.el .eid { font: 700 11px/1.7 ui-monospace, "SF Mono", Menlo, monospace; color: var(--blue); background: var(--blue-bg); border-radius: 6px; padding: 1px 0; text-align: center; height: fit-content; }
.el .en { font-weight: 650; font-size: 14px; }
.el .pill { align-self: start; }
.el .eu { grid-column: 2 / 4; font-size: 13.5px; color: var(--ink2); }
.el .eu b { color: var(--ink); font-weight: 650; }
.el .em { grid-column: 2 / 4; display: flex; flex-wrap: wrap; gap: 3px 16px; font-size: 12px; color: var(--ink2); }
.el .em span b { font-weight: 600; margin-right: 5px; }
.el .em code { font-size: 11.5px; }
/* .builds — the frames a phase builds to, open, above its steps; then the element ids it covers. */
.builds { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin: 12px 0 4px; }
.builds .frame img { max-height: 240px; object-fit: cover; object-position: top; }
.builds-els { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 8px 0 12px; font-size: 12.5px; color: var(--ink2); }
.steps { counter-reset: st; margin: 12px 0; }
.step { display: flex; gap: 15px; padding: 11px 0; border-bottom: 1px dashed var(--line); }
.step:last-child { border-bottom: none; }
.step::before { counter-increment: st; content: counter(st); flex: 0 0 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--surface); font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center; }
.step div { font-size: 14px; }
.step b { display: block; }
table { width: 100%; border-collapse: collapse; font-size: 13px; margin: 8px 0; }
th { text-align: left; font-size: 11.5px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink2); padding: 8px 10px; border-bottom: 2px solid var(--line); }
td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: none; }
.tbl-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 4px 10px; }
.pill { display: inline-block; font-size: 11.5px; font-weight: 700; border-radius: 999px; padding: 2px 9px; white-space: nowrap; }
.pill.ok { background: var(--green-bg); color: var(--green); }
.pill.err { background: var(--red-bg); color: var(--red); }
.pill.warn { background: var(--amber-bg); color: var(--amber); }
.pill.info { background: var(--blue-bg); color: var(--blue); }
details { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); margin: 10px 0; }
details > summary { cursor: pointer; padding: 11px 15px; font-weight: 600; font-size: 13.5px; list-style: none; display: flex; align-items: center; gap: 10px; }
details > summary::before { content: "+"; font-weight: 700; color: var(--accent); width: 13px; }
details[open] > summary::before { content: "–"; }
details > summary:hover { background: var(--surface2); border-radius: 10px; }
details .d-body { padding: 4px 17px 15px; font-size: 13.5px; }
details .d-body p { color: var(--ink2); margin: 6px 0; }
/* The inset is the panel's, not the wrapper's: content written straight into a <details>,
   with no .d-body around it, still clears the border. */
details > :not(summary):not(.d-body) { margin-inline: 17px; max-width: calc(100% - 34px); }
details > :not(summary):not(.d-body):last-child { margin-bottom: 13px; }
summary .cnt { margin-left: auto; font-size: 11.5px; color: var(--ink2); font-weight: 500; }
/* #matrix — the scenario table in #tests. One row per scenario, transcribed from the phase
   payloads per references/test-scenarios.md. Do not restyle per plan. */
#matrix td { vertical-align: top; }
#matrix td.lvl, #matrix td.ph { white-space: nowrap; color: var(--ink2); }
#matrix .sc { display: block; margin-bottom: 5px; }
#matrix .given { display: block; color: var(--ink2); font-size: 13px; }
#matrix ul, #matrix ol { margin: 4px 0 0; padding-left: 19px; }
#matrix ul + .given, #matrix ol + .given { margin-top: 8px; }
#matrix li { color: var(--ink2); font-size: 13px; margin: 2px 0; }
.pipe { display: flex; flex-direction: column; margin: 16px 0; }
.pipe-stage { display: flex; gap: 15px; }
.pipe-rail { display: flex; flex-direction: column; align-items: center; width: 32px; flex-shrink: 0; }
.pipe-dot { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); color: var(--surface); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex-shrink: 0; }
.pipe-line { width: 2px; flex: 1; background: var(--line); min-height: 12px; }
.pipe-body { padding-bottom: 18px; flex: 1; }
.pipe-body b { font-size: 14.5px; }
.pipe-body p { font-size: 13.5px; color: var(--ink2); margin-top: 2px; max-width: 680px; }
.lock-note { background: var(--blue-bg); border-radius: 8px; padding: 8px 12px; font-size: 13px; color: var(--blue); margin-top: 8px; max-width: 680px; }
.phase-graph { display: flex; align-items: center; flex-wrap: wrap; margin: 4px 0 22px; }
.pg-node { background: var(--surface); border: 1.5px solid var(--accent); border-radius: 10px; padding: 7px 13px; font-size: 12.5px; font-weight: 600; text-align: center; }
.pg-node small { display: block; font-weight: 500; color: var(--ink2); font-size: 11px; }
.pg-arrow { color: var(--ink2); padding: 0 7px; font-size: 17px; }
.phase { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 12px; padding: 18px 21px; margin: 15px 0; }
.phase-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.phase-head .pnum { font-size: 11.5px; font-weight: 800; color: var(--accent); letter-spacing: 0.06em; }
.phase-head h3 { font-size: 17px; }
.unlock { background: var(--accent-soft); border-radius: 8px; padding: 9px 13px; font-size: 13.5px; margin: 11px 0; }
.unlock b { color: var(--accent); font-size: 11.5px; letter-spacing: 0.06em; text-transform: uppercase; display: block; margin-bottom: 2px; }
/* .impl — the implementation steps inside a phase drill-down. One <li> per step in that
   phase's payload, same order, same titles. Do not restyle per plan. */
.impl { counter-reset: ist; margin: 4px 0 2px; padding: 0; }
.impl > li { list-style: none; counter-increment: ist; position: relative; margin-left: 10px; padding: 0 0 17px 28px; border-left: 2px solid var(--line); }
.impl > li:last-child { border-left-color: transparent; padding-bottom: 2px; }
.impl > li::before { content: counter(ist); position: absolute; left: -11px; top: -1px; width: 20px; height: 20px; border-radius: 50%; background: var(--accent); color: var(--surface); font: 700 11px/20px -apple-system, sans-serif; text-align: center; }
.impl .it { font-size: 14px; font-weight: 650; color: var(--ink); margin-bottom: 3px; }
.impl p { font-size: 13.5px; color: var(--ink2); margin: 6px 0; max-width: 730px; }
.impl pre { font-size: 12px; margin: 8px 0; max-width: 730px; }
.impl .rule { background: var(--surface2); border-radius: 8px; padding: 8px 12px; margin: 9px 0 0; font-size: 13px; color: var(--ink2); max-width: 730px; }
.impl .rule b { display: block; margin-bottom: 2px; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink); }
.impl .rule.trap { background: var(--amber-bg); }
.impl .rule.trap b { color: var(--amber); }
.impl .snip-lbl { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; margin: 11px 0 0; }
.impl .snip-lbl.diff { color: var(--blue); }
.impl .snip-lbl.diff code { text-transform: none; letter-spacing: normal; font-weight: 600; }
.impl .snip-lbl.cur { color: var(--ink2); }
.impl .snip-lbl .why { display: block; margin-top: 2px; font-size: 12.5px; font-weight: 500; letter-spacing: normal; text-transform: none; color: var(--ink2); }
.impl .snip-lbl + pre { margin-top: 5px; }
/* pre.diff — a unified diff. The engine wraps each line by its first character: "+" added,
   "-" removed, "@@" a hunk header, anything else context. Authors write plain diff text. */
pre.diff { padding: 10px 0; }
pre.diff .ln { display: block; padding: 0 17px; white-space: pre; }
pre.diff .add { background: color-mix(in srgb, var(--green) 26%, transparent); }
pre.diff .del { background: color-mix(in srgb, var(--red) 26%, transparent); }
pre.diff .hunk { color: var(--code-cm); }
.impl details.media { margin: 9px 0 0; max-width: 730px; }
.impl details.media > summary { font-size: 12.5px; padding: 8px 12px; }
.impl details.media img { display: block; max-width: 100%; border: 1px solid var(--line); border-radius: 8px; margin-block: 2px 5px; }
.impl details.media .cap { font-size: 12px; color: var(--ink2); margin-block: 0 9px; }
/* .d-body is what insets a panel. A media panel written without one insets its own children,
   so the frame clears the border either way. Both rules set margin-block only — a shorthand
   here would reset the inline margins these two restore. */
.impl details.media > img, .impl details.media > .cap { margin-inline: 12px; max-width: calc(100% - 24px); }
footer { border-top: 1px solid var(--line); margin-top: 44px; padding: 20px 0 10px; font-size: 12.5px; color: var(--ink2); }
.svgd { width: 100%; height: auto; margin: 12px 0; }
.svgd .box { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; rx: 8; }
.svgd .box-new { fill: var(--accent-soft); stroke: var(--accent); }
.svgd .box-dim { fill: var(--surface2); stroke: var(--line); }
.svgd text { fill: var(--ink); font: 600 12px -apple-system, sans-serif; }
.svgd .t2 { fill: var(--ink2); font-weight: 400; font-size: 10.5px; }
.svgd .tn { fill: var(--accent); font-weight: 700; font-size: 10px; letter-spacing: 0.5px; }
.svgd .arr { stroke: var(--ink2); stroke-width: 1.5; fill: none; marker-end: url(#ah); }
.svgd .arr-dim { stroke: var(--line); stroke-width: 1.5; fill: none; marker-end: url(#ah); stroke-dasharray: 4 3; }
.x { border-bottom: 1px dashed var(--accent); cursor: pointer; position: relative; font-family: ui-monospace, monospace; font-size: 0.92em; font-weight: 600; color: var(--accent); white-space: nowrap; }
.x:hover::after, .x.show::after {
  content: attr(data-t); position: absolute; bottom: calc(100% + 7px); left: 50%; transform: translateX(-50%);
  background: var(--tip-bg); color: var(--tip-ink); font: 500 12px/1.5 -apple-system, sans-serif;
  padding: 8px 11px; border-radius: 8px; width: max-content; max-width: 320px; white-space: normal;
  z-index: 90; box-shadow: 0 4px 18px rgba(0,0,0,0.25); pointer-events: none;
}
.x:hover::before, .x.show::before {
  content: ""; position: absolute; bottom: calc(100% + 1px); left: 50%; transform: translateX(-50%);
  border: 6px solid transparent; border-top-color: var(--tip-bg); z-index: 91;
}
.flash { animation: flash 1.6s ease-out; }
@keyframes flash { 0%, 40% { background: var(--amber-bg); } 100% { background: transparent; } }
.slot-loading { display: flex; align-items: center; gap: 10px; color: var(--ink2); font: 500 13.5px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; letter-spacing: normal; text-transform: none; padding: 18px 4px; }
.spin { width: 15px; height: 15px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; flex-shrink: 0; }
@keyframes spin { to { transform: rotate(360deg); } }
/* .lightbox — any design frame, full size. The engine opens it on click, Enter or Space; the ✕,
   the backdrop and Escape close it. Sits under the comments overlay (z 2147483000+) so that stays reachable. */
img[data-img] { cursor: zoom-in; }
img[data-img]:focus-visible, .lb-close:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.lightbox { position: fixed; inset: 0; z-index: 200; display: none; align-items: center; justify-content: center; padding: 40px; background: rgba(14, 12, 10, 0.86); }
.lightbox.open { display: flex; }
.lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 10px; box-shadow: 0 12px 48px rgba(0,0,0,0.5); cursor: default; }
.lightbox .lb-close { position: absolute; top: 14px; right: 16px; width: 38px; height: 38px; border: 1px solid rgba(255,255,255,0.25); border-radius: 50%; background: rgba(30,28,25,0.85); color: #f2efe9; font: 500 20px/1 -apple-system, sans-serif; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.lightbox .lb-close:hover { background: rgba(60,56,50,0.95); }
.lightbox .lb-cap { position: absolute; left: 0; right: 0; bottom: 12px; text-align: center; color: #d8d3ca; font-size: 12.5px; padding: 0 60px; pointer-events: none; }
.writing-pill { position: fixed; right: 18px; bottom: 18px; z-index: 95; display: flex; align-items: center; gap: 9px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; font-size: 12.5px; font-weight: 600; color: var(--ink2); box-shadow: 0 4px 18px rgba(0,0,0,0.14); }
</style>
</head>
<body>
<div class="layout">

<aside class="side">
  <div class="brand"><!-- SLOT:brand — "<TICKET> · Plan" --></div>
  <nav id="side-nav">
    <!-- SLOT:nav — one <a href="#id"> per section on the page, in page order, each prefixed
         with its section number; then a "Jump to" .grp with shortcuts to #decisions and #matrix.
         Written at step 1 with the sections that exist so far; rewritten at step 7. -->
  </nav>
  <div class="foot"><button class="theme-btn" onclick="toggleTheme()">◐ Theme</button></div>
</aside>

<main id="main">
  <!-- Every section below is its own slot, so a half-written page shows a spinner exactly where
       the next part will land. A section with nothing to say is deleted whole, slot included;
       section numbers are fixed and a gap is fine. Prose follows the writing-style skill. -->
  <section id="top">
    <!-- SLOT:hero — step 1: .kicker, h1, .lede (the task in one or two sentences), .links
         (ticket, PRD, then the run-info span — last item, plain text, not a link).
         Step 7 adds .chips (the counts) above .links. -->
  </section>

  <!-- SLOT:banner — .callout.warn, ONLY when a real risk or known gap exists: what is unverified,
       why, and what fixes it. Delete this comment when there is none. -->

  <section id="designs">
    <!-- SLOT:designs — step 1, when the design scout returns an INDEX: .sec-head (num 01), then
         a .gallery with one .frame per INDEX row, open: <img data-img="file.png" alt="…">,
         .ft the screen name, .fs what it settles, .fn the file. Delete the section when there
         is no INDEX. -->
  </section>

  <section id="problem">
    <!-- SLOT:problem — .sec-head (num 02), short problem prose, .steps primary flow. -->
  </section>

  <section id="requirements">
    <!-- SLOT:requirements — .sec-head (num 03), .grid.g2 of .card, one per acceptance
         criterion, id per criterion, each naming the scenarios that prove it. -->
  </section>

  <section id="design">
    <!-- SLOT:design — .sec-head (num 04), approach prose, .svgd system diagram, .pipe
         request/data flow, API surface table, decisions table (h3 id="decisions"; tr id per
         decision; What we do · Instead of · Because). -->
  </section>

  <section id="design-system">
    <!-- SLOT:design-system — .sec-head (num 05); filled by a project extension that produced a
         component inventory, as soon as its scout returns. Shape: .tiles of verdict counts ·
         .callout.key for the finding that changes the plan · .filter buttons · one .screen per
         design frame (.screen-frame beside .els of .el cards, each data-verdict). Delete the
         section when no inventory exists. -->
  </section>

  <section id="phases">
    <!-- SLOT:phases — .sec-head (num 06), .phase-graph, then one .phase card per phase:
         goal line · .builds (the frames it builds to, open, as .frame with data-img) ·
         .builds-els (the element ids it covers, as .x spans — only when an extension produced
         an element inventory) · .unlock ("After this lands…") ·
         details holding an ol.impl — one li per implementation step in that phase's payload,
         same order, same titles, carrying that step's prose, its pre.diff blocks and its .rule
         box. Every details opens with its summary, and the panel wraps in .d-body:
           <details><summary>The work <span class="cnt">4 steps</span></summary>
             <div class="d-body"><ol class="impl">…</ol></div></details>
         A step's design panel takes the same shape, captioned:
           <details class="media"><summary>Design — what it settles</summary>
             <div class="d-body"><img data-img="x.png" alt="…">
             <div class="cap">…</div></div></details> -->
  </section>

  <section id="tests">
    <!-- SLOT:tests — .sec-head (num 07), then one table (id="matrix"), no details wrapper:
         Scenarios · Level · Phase, one row per scenario across the phase payloads, transcribed
         from their ## Test Scenarios (references/test-scenarios.md). -->
  </section>

  <footer>
    <!-- SLOT:footer — one line: sources + PR links + style note. -->
  </footer>
</main>
</div>

<!-- ====================================================================
     AGENT PAYLOAD — the markdown the coder agents receive, embedded so the
     reviewed page and the executed plan are one artifact. One block per file.
     data-file paths are relative to the spec dir (.harness/<name>/).
     If a payload ever needs a literal "</script>", write "<\/script>".
     Extracted post-approval by scripts/extract-plan.mjs.
==================================================================== -->
<script type="text/markdown" data-file="plan.md">
<!-- SLOT:plan-md — full plan.md per references/plan-sections.md -->
</script>
<script type="text/markdown" data-file="phases/phase-1.md">
<!-- SLOT:phase-md — one block per phase file, per references/plan-sections.md -->
</script>

<script>
/* ============================================================
   ENGINE — do not edit. Fill the three data objects below.
   ============================================================ */
function toggleTheme() {
  const root = document.documentElement;
  const cur = root.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : cur === 'light' ? 'dark'
    : (matchMedia('(prefers-color-scheme: dark)').matches ? 'light' : 'dark');
  root.setAttribute('data-theme', next);
}
if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.setAttribute('data-theme','dark');

/* SLOT:xrefs — every internal id used anywhere on the page → [tooltip text, jump-target id or ""].
   Cover: requirement ids, decision ids, flow/edge-case ids, element ids, error codes. Scenario
   ids stay out — they name a heading in the phase file, not a target on this page. */
const X = {
};

/* SLOT:images — do not fill this by hand. Run scripts/inline-designs.ts on this file and it
   writes every frame the page references, as "file.png": "data:image/png;base64,…". Each file
   lands ONCE however many places use it; the engine wires it to every
   <img data-img="file.png">. A frame with no entry here renders blank — no other breakage. */
const IMG = {
};

/* ---- engine: design images ----
   Not lazy: the bytes are already in the document, so deferring buys no request. It only
   costs — an image revealed by opening a <details> was display:none when the viewport
   observer ran, and stays unloaded. */
document.querySelectorAll('img[data-img]').forEach((el) => {
  const src = IMG[el.dataset.img];
  if (src) { el.src = src; }
  el.tabIndex = 0;
  el.setAttribute('role', 'button');
  el.setAttribute('aria-label', `Expand: ${el.alt || el.dataset.img}`);
});

/* ---- engine: lightbox ----
   A frame in a 260px grid cell is too small to read its components. Clicking any design image
   shows it at full size over the page, with its alt text as the caption. Frames are focusable
   buttons so Enter and Space open them too; closing returns focus to the frame. */
const lightbox = document.createElement('div');
lightbox.className = 'lightbox';
lightbox.innerHTML = '<button class="lb-close" type="button" aria-label="Close">\u00d7</button><img alt=""><div class="lb-cap"></div>';
document.body.appendChild(lightbox);
const lbImg = lightbox.querySelector('img');
const lbCap = lightbox.querySelector('.lb-cap');
let lbOpener = null;
const closeLightbox = () => {
  if (!lightbox.classList.contains('open')) return;
  lightbox.classList.remove('open'); lbImg.removeAttribute('src');
  if (lbOpener) { lbOpener.focus(); lbOpener = null; }
};
const openLightbox = (el) => {
  if (!el.src) return;
  lbOpener = el;
  lbImg.src = el.src; lbImg.alt = el.alt; lbCap.textContent = el.alt;
  lightbox.classList.add('open');
  lightbox.querySelector('.lb-close').focus();
};
document.addEventListener('click', (e) => {
  const img = e.target.closest('img[data-img]');
  if (img) { openLightbox(img); return; }
  if (e.target.closest('.lb-close') || e.target === lightbox) closeLightbox();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closeLightbox(); return; }
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const img = e.target.closest && e.target.closest('img[data-img]');
  if (img) { e.preventDefault(); openLightbox(img); }
});

/* ---- engine: diff lines ----
   Authors write plain unified-diff text inside <pre class="diff"><code>. Each line is wrapped
   and classed by its first character, so the colouring is never hand-written. */
document.querySelectorAll('pre.diff > code').forEach((code) => {
  const lines = code.innerHTML.split('\n');
  if (lines.length && lines[lines.length - 1] === '') lines.pop();
  code.innerHTML = lines.map((line) => {
    const cls = line.startsWith('+') ? 'add' : line.startsWith('-') ? 'del'
      : line.startsWith('@@') ? 'hunk' : 'ctx';
    return '<span class="ln ' + cls + '">' + (line || ' ') + '</span>';
  }).join('');
});

/* ---- engine: verdict filters ----
   A .filter button toggles on; while any button in the group is on, every [data-verdict] in
   the same <section> that matches none of the on buttons hides. All off shows everything. */
document.querySelectorAll('.filter button[data-v]').forEach((btn) => {
  btn.addEventListener('click', () => {
    btn.classList.toggle('on');
    const group = btn.parentElement;
    const on = [...group.querySelectorAll('button.on')].map((b) => b.dataset.v);
    const scope = btn.closest('section') || document;
    scope.querySelectorAll('[data-verdict]').forEach((el) => {
      el.classList.toggle('off', on.length > 0 && !on.includes(el.dataset.verdict));
    });
  });
});

/* ---- engine: give every <details> a <summary> ----
   A summary-less <details> falls back to the browser's own marker: an unstyled control
   labelled "Details" that collapses the panel behind a word naming nothing. Rather than
   trust every panel to carry one, derive the missing ones — a phase panel from the steps
   it holds, a design panel from the caption or the alt text. */
document.querySelectorAll('details').forEach((d) => {
  if (d.firstElementChild && d.firstElementChild.tagName === 'SUMMARY') return;
  const steps = d.querySelectorAll('.impl > li').length;
  const img = d.querySelector('img');
  const cap = d.querySelector('.cap');
  const label = steps ? 'The work' : (cap && cap.textContent.trim())
    || (img && ('Design — ' + (img.alt || img.dataset.img))) || 'Details';
  const s = document.createElement('summary');
  s.textContent = label;
  if (steps) {
    const c = document.createElement('span');
    c.className = 'cnt'; c.textContent = steps + (steps === 1 ? ' step' : ' steps');
    s.appendChild(c);
  }
  d.prepend(s);
});

/* ---- engine: auto-link internal ids in prose ----
   xref-regex — extend the alternation to match this feature's id families.
   Longest alternatives first. */
const RX = /\b(D\d{1,2}|AC\d{1,2}|FL\d{1,2}|EC\d{1,2}|E\d{1,2})\b/g;
function linkify(root) {
  const test = new RegExp(RX.source);
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode(n) {
    const p = n.parentElement;
    if (!p || p.closest('pre, script, style, .x, .cid, nav')) return NodeFilter.FILTER_REJECT;
    return test.test(n.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
  }});
  const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach((n) => {
    const s = n.nodeValue, frag = document.createDocumentFragment();
    let last = 0, m; RX.lastIndex = 0;
    while ((m = RX.exec(s))) {
      const key = m[0];
      if (!X[key]) continue;
      frag.appendChild(document.createTextNode(s.slice(last, m.index)));
      const sp = document.createElement('span');
      sp.className = 'x'; sp.textContent = key; sp.dataset.x = key;
      frag.appendChild(sp); last = m.index + key.length;
    }
    frag.appendChild(document.createTextNode(s.slice(last)));
    n.parentNode.replaceChild(frag, n);
  });
}
linkify(document.getElementById('main'));

/* ---- engine: tooltips + click-to-jump on every .x ---- */
document.querySelectorAll('.x').forEach((sp) => {
  const e = X[sp.dataset.x];
  if (!e) return;
  sp.dataset.t = e[0];
  sp.addEventListener('click', () => {
    if (!e[1]) return;
    const t = document.getElementById(e[1]);
    if (!t) return;
    const d = t.closest('details'); if (d) d.open = true;
    t.scrollIntoView({ behavior: 'smooth', block: 'center' });
    t.classList.remove('flash'); void t.offsetWidth; t.classList.add('flash');
  });
});

/* ---- engine: loaders while the page is still being written ----
   Any SLOT: comment left in the body renders as a spinner; a floating pill
   says the page updates itself. Both vanish once every slot is filled. */
const slotWalker = document.createTreeWalker(document.body, NodeFilter.SHOW_COMMENT);
const pendingSlots = [];
while (slotWalker.nextNode()) {
  if (/^\s*SLOT:/.test(slotWalker.currentNode.nodeValue)) pendingSlots.push(slotWalker.currentNode);
}
pendingSlots.forEach((c) => {
  const el = document.createElement('div');
  el.className = 'slot-loading';
  el.innerHTML = '<span class="spin"></span><span>Still writing this part…</span>';
  c.parentNode.insertBefore(el, c.nextSibling);
});
if (pendingSlots.length) {
  const pill = document.createElement('div');
  pill.className = 'writing-pill';
  pill.innerHTML = '<span class="spin"></span>Plan in progress — updates automatically';
  document.body.appendChild(pill);
}

/* ---- engine: sidebar scroll-spy ---- */
const navLinks = [...document.querySelectorAll('#side-nav a')].filter(a => a.hash);
const spyTargets = navLinks.map(a => document.querySelector(a.hash)).filter(Boolean);
const spy = new IntersectionObserver((entries) => {
  entries.forEach(e => {
    if (!e.isIntersecting) return;
    navLinks.forEach(a => a.classList.toggle('on', a.hash === '#' + e.target.id));
  });
}, { rootMargin: '-20% 0px -70% 0px' });
spyTargets.forEach(t => spy.observe(t));
</script>
</body>
</html>
