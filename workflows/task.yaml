name: task
inputs:
  prompt:
    type: string
    required: true
  # Which entry of the config's environments block qa verifies against: `default` is the entry the
  # block names as its default. Pick another with `yok run … --input environment=NAME`.
  environment:
    type: string
    default: default
doctor:
  - check: env
    key: LINEAR_API_KEY
    fix: Set LINEAR_API_KEY in .env
  - check: binary
    key: bun
    fix: Install Bun
  - check: binary
    key: gh
    fix: Install the GitHub CLI and run gh auth login
nodes:
  - id: ticket-fetcher
    type: agent
    stage: ticket-fetcher
    input:
      request: "{{ inputs.prompt }}"

  - id: create-workspace
    type: agent
    stage: create-workspace
    notify: false
    dependsOn: [ticket-fetcher]
    input:
      request: "{{ nodes.ticket-fetcher.output.task }}"

  - id: baseline
    type: agent
    stage: baseline
    notify: false
    dependsOn: [create-workspace]
    input: {}

  - id: design
    type: agent
    stage: design
    dependsOn: [baseline]
    input:
      task: "{{ nodes.ticket-fetcher.output.task }}"

  - id: planning
    type: agent
    stage: planning
    dependsOn: [design]
    input:
      task: "{{ nodes.ticket-fetcher.output.task }}"
      workspace: "{{ nodes.create-workspace.output }}"

  - id: implement
    type: agent
    stage: implement
    dependsOn: [planning]
    input:
      workspace: "{{ nodes.create-workspace.output }}"

  - id: code-review
    type: agent
    stage: code-review
    dependsOn: [implement]
    input:
      workspace: "{{ nodes.create-workspace.output }}"

  - id: qa-loop
    type: loop
    dependsOn: [code-review]
    until: "{{ iteration.nodes.qa.output.status != 'FAIL' }}"
    maxIterations: 4
    input:
      workspace: "{{ nodes.create-workspace.output }}"
      task: "{{ nodes.ticket-fetcher.output.task }}"
      environment: "{{ inputs.environment }}"
    nodes:
      - id: fix
        type: agent
        stage: implement
        when: "{{ iteration.index > 1 }}"
        input:
          workspace: "{{ inputs.workspace }}"
          feedback: "{{ iteration.previous.bugs }}"

      - id: qa
        type: agent
        stage: qa
        variables:
          environment: "{{ inputs.environment }}"
        input:
          workspace: "{{ inputs.workspace }}"
          task: "{{ inputs.task }}"
          round: "{{ iteration.index }}"
          rounds: "{{ iteration.max }}"

  - id: commit
    type: agent
    stage: git-commit
    dependsOn: [qa-loop]
    # A BLOCKED qa could not verify the change, so nothing is published; pr is skipped with it.
    when: "{{ nodes.qa-loop.output.status != 'BLOCKED' }}"
    input:
      workspace: "{{ nodes.create-workspace.output }}"

  - id: pr
    type: agent
    stage: visual-pr
    dependsOn: [commit]
    input:
      workspace: "{{ nodes.create-workspace.output }}"
      task: "{{ nodes.ticket-fetcher.output.task }}"

  # Audits the run for yok defects. always: it runs after a failed node too; allowFailure:
  # its own failure never changes the run's status.
  - id: retro
    type: agent
    stage: retro
    notify: false
    dependsOn: [pr]
    always: true
    allowFailure: true
    input: {}
