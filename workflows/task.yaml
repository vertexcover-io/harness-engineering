name: task
inputs:
  prompt:
    type: string
    required: true
doctor:
  - check: env
    key: LINEAR_API_KEY
    fix: Set LINEAR_API_KEY in .env
  - check: binary
    key: bun
    fix: Install Bun
nodes:
  - id: ticket-fetcher
    type: agent
    stage: ticket-fetcher
    input:
      request: "{{ inputs.prompt }}"

  - id: create-workspace
    type: agent
    stage: create-workspace
    dependsOn: [ticket-fetcher]
    input:
      request: "{{ nodes.ticket-fetcher.output.task }}"

  - id: baseline
    type: agent
    stage: baseline
    dependsOn: [create-workspace]
    input: {}

  - id: design
    type: agent
    stage: design
    dependsOn: [baseline]
    input:
      task: "{{ nodes.ticket-fetcher.output.task }}"

  - id: planning
    type: agent
    stage: planning
    dependsOn: [design]
    input:
      task: "{{ nodes.ticket-fetcher.output.task }}"
      workspace: "{{ nodes.create-workspace.output }}"

  - id: implement
    type: agent
    stage: implement
    dependsOn: [planning]
    input:
      workspace: "{{ nodes.create-workspace.output }}"

  - id: code-review
    type: agent
    stage: code-review
    dependsOn: [implement]
    input:
      workspace: "{{ nodes.create-workspace.output }}"

  - id: qa-loop
    type: loop
    dependsOn: [code-review]
    until: "{{ iteration.nodes.qa.output.status != 'FAIL' }}"
    maxIterations: 4
    input:
      workspace: "{{ nodes.create-workspace.output }}"
      task: "{{ nodes.ticket-fetcher.output.task }}"
    nodes:
      - id: fix
        type: agent
        stage: implement
        when: "{{ iteration.index > 1 }}"
        input:
          workspace: "{{ inputs.workspace }}"
          feedback: "{{ iteration.previous.bugs }}"

      - id: qa
        type: agent
        stage: qa
        input:
          workspace: "{{ inputs.workspace }}"
          task: "{{ inputs.task }}"
          round: "{{ iteration.index }}"
          rounds: "{{ iteration.max }}"
