name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19

      # version-gate.sh reads plugin.json from main to tell an installed harness
      # it is stale, so a tag that disagrees with the manifests would announce a
      # release nobody can actually install.
      - name: Check the tag matches the version in both manifests
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          for manifest in package.json .claude-plugin/plugin.json; do
            declared=$(node -p "require('./$manifest').version")
            if [ "$tagged" != "$declared" ]; then
              echo "tag $GITHUB_REF_NAME does not match $manifest version $declared" >&2
              exit 1
            fi
          done

      - run: bun run test:scripts

      - run: bun run test:hooks

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
