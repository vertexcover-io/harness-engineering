name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Both runtimes, because the release script is meant to run under either
      # and only CI can catch one of them drifting.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19

      # version-gate.sh reads plugin.json from main to tell an installed harness
      # it is stale, so a tag that disagrees with the manifests would announce a
      # release nobody can actually install.
      - name: Check the tag matches the version in both manifests
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          for manifest in package.json .claude-plugin/plugin.json; do
            declared=$(node -p "require('./$manifest').version")
            if [ "$tagged" != "$declared" ]; then
              echo "tag $GITHUB_REF_NAME does not match $manifest version $declared" >&2
              exit 1
            fi
          done

      - run: npm run test:scripts

      - run: npm run test:scripts:bun

      - run: npm run test:hooks

      # A release cut on the wrong runtime is a silent no-op, so prove the
      # script actually rewrites both manifests before trusting it to tag.
      - name: Check the release script runs under both runtimes
        run: |
          for runner in node bun; do
            $runner scripts/version.ts 99.99.99 --no-git
            grep -q '"version": "99.99.99"' package.json
            grep -q '"version": "99.99.99"' .claude-plugin/plugin.json
            git checkout package.json .claude-plugin/plugin.json
            echo "$runner: ok"
          done

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
